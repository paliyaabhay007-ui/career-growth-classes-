<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Growth Classes</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fb;
line-height:1.6;
}

header{
background:#0d6efd;
color:white;
text-align:center;
padding:20px;
}

nav{
background:#222;
padding:15px;
text-align:center;
}

nav a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.hero{
background:#0d6efd;
color:white;
padding:80px 20px;
text-align:center;
}

.btn{
display:inline-block;
padding:12px 25px;
background:#ffc107;
color:black;
text-decoration:none;
border-radius:5px;
font-weight:bold;
}

.section{
padding:50px 20px;
text-align:center;
}

.cards{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
width:300px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.old{
text-decoration:line-through;
color:red;
}

.new{
color:green;
font-size:28px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
background:#0d6efd;
color:white;
border:none;
padding:12px 25px;
border-radius:5px;
cursor:pointer;
}

footer{
background:#222;
color:white;
padding:20px;
text-align:center;
}

.whatsapp{
position:fixed;
bottom:20px;
right:20px;
width:60px;
height:60px;
background:#25D366;
color:white;
border-radius:50%;
text-align:center;
line-height:60px;
font-size:28px;
text-decoration:none;
}

@media(max-width:768px){
.cards{
flex-direction:column;
align-items:center;
}
}
</style>
</head>

<body>

<header>
<h1>Career Growth Classes</h1>
